name: capability_scope
version: 0.2.0
kind: standalone
description: Experiment prototype of per-turn tool and skill scoping (docs/designs/context-scoped-capabilities.md). Inert unless KA_SCOPE_MODE names an arm; then records what the model was shown and used, and scopes skills and tools per the arm.
provides_hooks: [pre_llm_call, pre_tool_call, post_api_request]
