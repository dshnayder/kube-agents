name: chat-platform
label: Chat Agent
kind: platform
version: 1.0.0
description: >
  Delivery-only platform that hands a cron job's finished report to the Chat
  Agent instead of posting it, so the finding lands in a thread that can answer
  the follow-up. Registers no inbound adapter: the only hook it implements is
  standalone_sender_fn, which POSTs the report to the Session KV server's
  /v1/cron-reports route over loopback.

  Hermes derives the platform name by stripping "-platform" from this manifest
  name, so `deliver: "chat"` is what a job sets. See
  docs/designs/cron-report-relay.md.
author: kube-agents
optional_env:
  - name: CHAT_HOME_CHANNEL
    description: >
      Set to enable the relay in this process. profile_cron_tick.py sets it for
      every cron child; the gateway leaves it unset, which is what keeps this
      platform out of `hermes gateway status` and stops it being started as an
      adapter. Its value is a label only — the relay route has one destination.
    prompt: "Chat Agent relay label (leave empty to disable)"
    password: false
  - name: CRON_REPORT_RELAY_URL
    description: "Session KV server relay route (default: http://127.0.0.1:8699/v1/cron-reports)"
    prompt: "Relay URL"
    password: false
  - name: SESSION_KV_API_KEY
    description: "Bearer token for the Session KV server. Without it the relay cannot authenticate."
    prompt: "Session KV API key"
    password: true
