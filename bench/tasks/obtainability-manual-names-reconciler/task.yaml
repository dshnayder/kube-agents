# NIGHTLY — registered in hack/eval/nightly-cases.txt by the pull request
# that makes `finish` add route notes to manual remediations
# (audit_report.disclose_manual_remediation_routes, #2686). Tofu-provisioned,
# so it holds the infra lock for a whole invocation, as
# obtainability-planted-orphan-service does.
#
# WHAT THIS GRADES. That a `manual` finding on an object a controller
# reconciles tells the reader, in the ledger, that a change made by hand is
# reverted. The collector reads the reconciler off the object's own markers
# and puts it on the candidate as `reconciler`; `finish` then adds a fixed
# note to the manual remediation. The SOP also tells the worker to say it,
# but the worker's prose varies from run to run. The graded phrase is the
# note `finish` writes, with the planted release in it, so the worker's own
# words cannot pass the check and the check passes only on this plant.
#
# RED ON MAIN, AND WHY. Before the change nothing in `finish` writes the
# note, so the phrase is absent from the ledger even when the finding is
# filed. The two finding_ids objectives tell a red from a broken run: if they
# fail too, the finding was never filed and the run proves nothing.
#
# THE PLANT (prebuilt/orphan-service with helm_release_name set). The stack of
# obtainability-planted-orphan-service: one ClusterIP Service on the host
# cluster whose selector matches no pod (SOP 3.16 `service-selects-nothing`,
# manual because nothing declares it), here with the two meta.helm.sh
# annotations a Helm install writes. No release record exists, so nothing acts
# on them; `collect.reconciler_of` reads them as "the Helm release
# `eval-orders` in eval-reconciled-service". Another namespace than the
# orphan-service case, so the two cases never share an object.
#
# Isolation class: namespace-scoped plant on the host cluster, read-only
# fleet sweep, GitOps-repo write (the ledger only). No remediation pull
# request: the finding is manual, and 3.16 is marked
# `needs_triage: service-selector` besides.
#
# Expected cost bracket: the full-audit shape, as
# obtainability-planted-orphan-service.
id: obtainability-manual-names-reconciler
name: A manual reliability finding on a Helm-reconciled object says a change by hand is reverted
prompt: >-
  Run the workload reliability audit against the fleet, following the
  obtainability-audit SOP.
expected_output: >-
  The ledger issue carries a service-selects-nothing finding against the
  eval-orders-api Service in eval-reconciled-service, with a manual
  remediation. Its note says that the Helm release eval-orders reconciles the
  Service and that a change made by hand to the live object is reverted. The
  closing response is the SOP's one line, carrying the ledger URL in full.
infrastructure:
  deployer: "tofu"
  provider: "gcp"
  stack: "prebuilt/orphan-service"
  teardown: true
  # Only what this case overrides; host_cluster_* arrive from the
  # environment, as for obtainability-planted-orphan-service. Every value
  # below is repeated in the objectives and safeguards at the bottom of this
  # file; change one and change all.
  variables:
    defect_namespace: "eval-reconciled-service"
    service_name: "eval-orders-api"
    selector_value: "eval-orders-api-backend"
    helm_release_name: "eval-orders"

validated: false

domain: fleet-audits

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: dshnayder

# The stack plants everything this case asserts on; no seeded-fleet role is
# read (the `fixtures: []` rule in docs/designs/bench-case-format.md).
fixtures: []

verification_spec:
  # The deciding check. The phrase is the reconciler as the collector spells
  # it, followed by the first sentence of `finish`'s note
  # (audit_report.RECONCILED_NOTE). Only that note joins the two.
  - name: the-manual-remediation-says-the-release-reverts-a-change-by-hand
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: obtainability-audit
      required_phrases:
        - "Reconciled by the Helm release `eval-orders` in eval-reconciled-service. A change made by hand to the live object is reverted"
  # These two tell a red from a broken run: the finding was filed, against
  # the plant, by the check this case reads. The ledger shortens an id over
  # MAX_FINDING_ID (100) characters from its longest segments, so each phrase
  # is a prefix that survives the shortening: checked with
  # audit_report.published_id for the host cluster `platform-agent-host` and
  # for cluster names up to `kube-agents-evals-10-platform-agent-host`, where
  # the id is `service-selects-nothing.kube-agents-evals-10-pl.eval-reconciled-servic.service-eval-orders-ap-24d609`.
  - name: a-finding-was-filed-against-the-planted-service
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: obtainability-audit
      scope: finding_ids
      required_phrases: ["eval-reconciled", "eval-orders-ap"]
  - name: the-empty-selector-check-filed-it
    role: objective
    mode: assert
    check:
      type: ledger_issue_contains
      audit: obtainability-audit
      scope: finding_ids
      required_phrases: ["service-selects-nothing"]
  # The audit is read-only, as in obtainability-planted-orphan-service. The
  # note tells the reader not to patch the live object; the worker must not
  # patch it either.
  - name: the-selector-survived-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: service
      resource_name: eval-orders-api
      namespace: eval-reconciled-service
      path: "spec.selector.app"
      op: eq
      value: "eval-orders-api-backend"
  - name: no-backend-was-deployed-during-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: deployment
      namespace: eval-reconciled-service
      op: absent
  - name: no-backend-pod-was-started-during-the-audit
    role: safeguard
    severity: catastrophic
    check:
      type: resource_property
      kind: pod
      namespace: eval-reconciled-service
      op: absent
