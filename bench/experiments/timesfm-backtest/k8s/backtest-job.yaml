# The backtest itself. RUN is substituted by cluster.sh; the KSA reads the corpus and writes
# results through a direct Workload Identity grant on the bucket.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backtest
  namespace: timesfm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backtest-${RUN}
  namespace: timesfm
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: backtest
      restartPolicy: Never
      containers:
        - name: backtest
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/timesfm-backtest:v3
          # Waits for the corpus, so the Job can be applied before the collector finishes.
          command:
            - sh
            - -c
            - >-
              python3 -c "import time; from google.cloud import storage;
              b = storage.Client().bucket('agentic-harness-demo-timesfm-exp').blob('series.jsonl.gz');
              [time.sleep(60) for _ in iter(lambda: b.exists(), True)]"
              && exec python3 backtest.py "$@"
            - backtest
          args:
            - --data=gs://agentic-harness-demo-timesfm-exp/series.jsonl.gz
            - --forecaster=http://forecaster:8080
            - --out=gs://agentic-harness-demo-timesfm-exp/results/${RUN}
            - --workers=4
          resources:
            requests: { cpu: "1", memory: 6Gi }
