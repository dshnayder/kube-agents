apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No `namespace:` here on purpose. The provisioning step applies this with
# `kubectl apply -n $NAMESPACE`, so the install honours the same namespace as
# every other step, and every in-cluster address below is a short service name
# that resolves wherever it lands.
#
# One thing does not follow: the Chat Agent image bakes the API's fully-qualified
# URL into agents/chat/defaults/hindsight/config.json. Installing into a
# namespace other than kubeagents-system means changing that file and rebuilding
# the agent image.

resources:
  - postgresql.yaml
  - networkpolicy.yaml
  - api.yaml
