---
# Round B probe 1, attempt 3 — determine what the specialist actually read.
#
# Attempt 1 read a stale on-disk export; attempt 2 read Postgres directly. Both
# routes are now closed (leftovers deleted, hindsight-postgresql scaled to 0,
# refusal verified from inside the cluster). Attempt 3 nevertheless wrote a
# verification harness — verify_sakeys.py and mutate_sakeys.py — so the question
# is what that harness reads. If it opens /opt/data/memories/MEMORY.md then Round B
# is finally measuring the file provider, and the file provider affords a second
# access path (direct grep over raw text) that Hindsight does not, which the
# comparison has to state rather than credit to recall quality.
#
# Reads only /opt/data/docs/standards/. Writes nothing.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-roundb-probe1c-artifact
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: roundb-probe1c-artifact
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: roundb-probe1c-artifact
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: read
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import os

              D = "/opt/data/docs/standards"
              if not os.path.isdir(D):
                  print("MISSING:", D)
                  raise SystemExit(0)

              paths = []
              for dp, dn, fn in os.walk(D):
                  dn[:] = [d for d in dn if d != "__pycache__"]
                  for n in sorted(fn):
                      paths.append(os.path.join(dp, n))

              print("== files ==")
              for p in paths:
                  print(f"  {os.path.getsize(p):>9}  {p}")

              # The scripts are the direct evidence of method.
              for p in paths:
                  if p.endswith(".py"):
                      print(f"\n===== {os.path.basename(p)} =====")
                      print(open(p, encoding="utf-8", errors="replace").read()[:7000])

              for p in paths:
                  if p.endswith(".md"):
                      txt = open(p, encoding="utf-8", errors="replace").read()
                      print(f"\n===== {os.path.basename(p)} ({len(txt)} chars) — head =====")
                      print(txt[:3000])

              blob = ""
              for p in paths:
                  try:
                      blob += open(p, encoding="utf-8", errors="replace").read()
                  except Exception:
                      pass

              print("\n== method markers ==")
              for m in ["memories/MEMORY.md", "MEMORY.md", "system_prompt", "system prompt",
                        "grep", "all_docs.json", "psycopg", "postgres", "POSTGRES", "psql",
                        "hindsight", "Hindsight", "8888", "5432", "recall", "multiuser_memory",
                        "1414", "1,414", "335", "§"]:
                  print(f"  {blob.count(m):5d}  {m}")
          volumeMounts:
            - name: data
              mountPath: /opt/data
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
            readOnly: true
