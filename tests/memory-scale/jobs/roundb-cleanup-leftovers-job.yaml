---
# Delete Round A's leftovers from the gateway PVC so Round B measures the file
# provider instead of a stale export.
#
# Probe 1's specialist answered by reading
# /opt/data/docs/standards/corpus/all_docs.json — the 335-document Hindsight
# export Round A was scored against — and never opened
# /opt/data/memories/MEMORY.md. Every one of the ten Round B probes has a Round A
# answer sitting somewhere under these paths, so all ten would be contaminated.
#
# The delete list is a literal allowlist, named by the user. No globs, no
# heuristics, no "anything matching". Anything not in TARGETS is not touched —
# in particular /opt/data/memories/ (the store Round B is supposed to use, plus
# the user's real personal file) and the seven pre-test kanban attachment
# directories.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-roundb-cleanup-leftovers
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: roundb-cleanup-leftovers
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: roundb-cleanup-leftovers
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import os, shutil

              # Exactly the paths named in the authorisation. Nothing else.
              TARGETS = [
                  "/opt/data/docs/standards",
                  "/opt/data/kanban/attachments/t_d1b32bd1",
                  "/opt/data/kanban/attachments/t_2314e0f2",
                  "/opt/data/kanban/attachments/t_becc496f",
                  "/opt/data/kanban/attachments/t_e817a615",
              ]

              def size_of(p):
                  if os.path.isfile(p):
                      return 1, os.path.getsize(p)
                  n = b = 0
                  for dp, _, fn in os.walk(p):
                      for f in fn:
                          try:
                              b += os.path.getsize(os.path.join(dp, f)); n += 1
                          except OSError:
                              pass
                  return n, b

              print("== deleting ==")
              tot_n = tot_b = 0
              for t in TARGETS:
                  if not os.path.exists(t):
                      print(f"  (absent)  {t}")
                      continue
                  n, b = size_of(t)
                  tot_n += n; tot_b += b
                  print(f"  {n:>4} files  {b:>9} bytes  {t}")
                  shutil.rmtree(t) if os.path.isdir(t) else os.remove(t)
              print(f"  -- {tot_n} files, {tot_b} bytes removed")

              print("\n== gone? ==")
              for t in TARGETS:
                  print(f"  {'GONE' if not os.path.exists(t) else 'STILL PRESENT'}  {t}")

              # The file store Round B actually measures must be untouched.
              print("\n== the file store, which must be intact ==")
              M = "/opt/data/memories/MEMORY.md"
              raw = open(M, encoding="utf-8").read()
              entries = [e for e in raw.split("\n§\n") if e.strip()]
              print(f"  MEMORY.md {os.path.getsize(M)} bytes, {len(entries)} entries (expect 444531 / 1414)")
              U = "/opt/data/memories/users"
              print(f"  users/: {sorted(os.listdir(U))}")

              # Surviving attachment dirs — these predate the test and stay.
              A = "/opt/data/kanban/attachments"
              print(f"\n== attachment dirs left in place ==")
              for n in sorted(os.listdir(A)):
                  print(f"  {n}")

              ok = (all(not os.path.exists(t) for t in TARGETS)
                    and os.path.getsize(M) == 444531 and len(entries) == 1414)
              print(f"\nRESULT: {'OK' if ok else 'FAILED'}")
              raise SystemExit(0 if ok else 1)
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
