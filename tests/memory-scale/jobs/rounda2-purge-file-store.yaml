---
# Delete the flat file store outright, and survey the PVC for every other copy.
#
# The predecessor job (rounda2-sever-file-store.yaml) renamed MEMORY.md to
# MEMORY.md.roundb-archived. That is not a boundary. Round B established twice
# over that a renamed or nominally-unreachable source is still reachable: the
# specialist found a stale JSON export on this same PVC, and then went to Postgres
# directly when the API was scaled to zero. A file called
# `MEMORY.md.roundb-archived` sitting next to `MEMORY.md` is an invitation.
#
# Deleting it costs nothing. The rename job printed the live file's sha256 as
# 9c4b40a4c02cd3cca0d50c343386017aa67d7b66fbf0d24dad5f61580fd57952, byte-identical
# to tests/memory-scale/fixtures/MEMORY.md.gz already in the repository — which is
# the copy the 110,799-token measurement was taken against. The PVC copy is
# redundant.
#
# The survey is the point of this job, though. Removing the one file we know about
# repeats the mistake of closing four improvisation routes while the corpus sat
# cached in a fifth. So: scan /opt/data for anything carrying corpus identifiers
# and REPORT it. Report only — the survey deletes nothing, because deciding what
# comes out is the user's call, and a heuristic filter over a shared volume is
# exactly the pattern that has been rejected throughout this test.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-rounda2-purge-file-store
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: rounda2-purge
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: rounda2-purge
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: purge
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260730-200423
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import os, re, hashlib

              # --- 1. delete the archived flat store (one literal path) ---------
              TARGET = "/opt/data/memories/MEMORY.md.roundb-archived"
              if os.path.exists(TARGET):
                  data = open(TARGET, "rb").read()
                  print(f"deleting {TARGET}")
                  print(f"  {len(data):,} bytes  sha256 {hashlib.sha256(data).hexdigest()}")
                  os.remove(TARGET)
              else:
                  print("ALREADY GONE:", TARGET)
              print("  MEMORY.md absent:         ", not os.path.exists("/opt/data/memories/MEMORY.md"))
              print("  archived copy absent:     ", not os.path.exists(TARGET))

              # --- 2. survey everything else (report only, no deletion) ---------
              IDS = re.compile(
                  r'\b(?:ADR-20\d\d-\d\d\d|RB-\d\d\d|PM-20\d\d-\d\d\d|CONV-\d\d\d'
                  r'|EXC-\d\d\d|DEP-\d\d\d|OWN-\d\d\d|GOT-\d\d\d|CAP-\d\d\d'
                  r'|MIG-\d\d\d|INV-\d\d\d)\b')
              MARKERS = ("mfs-prod-", "meridian", "Meridian")

              print("\n--- survey of /opt/data for corpus-bearing files ---")
              hits = []
              for root, dirs, files in os.walk("/opt/data"):
                  dirs[:] = [d for d in dirs if d not in (".git", "node_modules", "__pycache__", ".venv")]
                  for fn in files:
                      p = os.path.join(root, fn)
                      try:
                          if os.path.islink(p) or os.path.getsize(p) > 40_000_000:
                              continue
                          with open(p, "rb") as fh:
                              raw = fh.read(8_000_000)
                      except OSError:
                          continue
                      txt = raw.decode("utf-8", "replace")
                      ids = set(IDS.findall(txt))
                      if len(ids) >= 3 or (len(ids) >= 1 and any(m in txt for m in MARKERS)):
                          hits.append((len(ids), os.path.getsize(p), p))

              for n, size, p in sorted(hits, reverse=True):
                  print(f"  {n:>4} ids  {size:>10,} bytes  {p}")
              print(f"\n{len(hits)} corpus-bearing file(s). NOTHING above was deleted.")
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
