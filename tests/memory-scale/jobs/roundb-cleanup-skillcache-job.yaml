---
# Delete the corpus cache the specialist wrote into its own skill file.
#
# Probe 5's verify_backup.py named three data paths and none was the file store:
# /opt/data/kanban.db, an on-disk artifact, and this skill. The skill is 76,173
# bytes carrying 103 distinct corpus identifiers — a self-authored replica of the
# Round A Hindsight reads that reloads into context on every run, so probes 5 and
# 6 were both answered from it rather than from /opt/data/memories/MEMORY.md.
#
# The agent wrote this file; the image does not ship it. Deleting it removes a
# cache, not a capability.
#
# ONE literal path, authorised by the user. No globs, no heuristics. Everything
# else is untouched — in particular /opt/data/memories/, /opt/data/artifacts/,
# and every kanban attachment directory.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-roundb-cleanup-skillcache
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: roundb-cleanup-skillcache
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: roundb-cleanup-skillcache
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import os, re, shutil

              TARGET = ("/opt/data/profiles/platform/skills/governance/"
                        "meridian-standards-lookup/SKILL.md")
              PARENT = os.path.dirname(TARGET)
              IDS = re.compile(r'\b(?:ADR-20\d\d-\d\d\d|RB-\d\d\d|PM-20\d\d-\d\d\d|CONV-\d\d\d|EXC-\d\d\d|DEP-\d\d\d|OWN-\d\d\d|GOT-\d\d\d|CAP-\d\d\d|MIG-\d\d\d|INV-\d\d\d)\b')

              if not os.path.exists(TARGET):
                  print("ALREADY GONE:", TARGET)
                  raise SystemExit(0)

              txt = open(TARGET, encoding="utf-8", errors="replace").read()
              print(f"before: {len(txt):,} bytes, {len(set(IDS.findall(txt)))} distinct corpus ids")

              os.remove(TARGET)
              print("deleted:", TARGET)

              # The skill directory exists only to hold this file; remove it if
              # the agent left nothing else behind, but never anything above it.
              leftover = os.listdir(PARENT) if os.path.isdir(PARENT) else []
              if not leftover:
                  os.rmdir(PARENT)
                  print("removed empty dir:", PARENT)
              else:
                  print("kept dir (not empty):", PARENT, leftover)

              print("\nverify:")
              print("  target gone:  ", not os.path.exists(TARGET))
              print("  MEMORY.md intact:",
                    os.path.exists("/opt/data/memories/MEMORY.md"),
                    f"{os.path.getsize('/opt/data/memories/MEMORY.md'):,} bytes"
                    if os.path.exists("/opt/data/memories/MEMORY.md") else "")
              print("  artifacts dir untouched:",
                    len(os.listdir("/opt/data/artifacts")) if os.path.isdir("/opt/data/artifacts") else "n/a",
                    "files")
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
