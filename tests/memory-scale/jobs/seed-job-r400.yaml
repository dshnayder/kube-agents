---
# Seeds one rung of the Meridian fleet corpus into the live Hindsight bank.
#
# One Job per rung. Because the rungs are nested and the seeder resumes from the
# `context` field, running rung 200 after rung 100 writes only the 100-document
# delta — so walking the ladder costs the corpus once, not five times.
#
# The corpus arrives as a gzipped tarball in a ConfigMap's binaryData: the raw
# Markdown is 669 KB, which would fit under the 1 MiB object limit but leaves no
# headroom once the script ConfigMap and the Job spec are in the same etcd
# transaction. Compressed it is 72 KB.
#
# `limits.cpu` is mandatory here, not decorative: platform-baseline-quota hard-
# requires it, and a pod without it is rejected with a FailedCreate event that
# the Job itself reports only as "Running with 0 pods".
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-fleettest-seed-r400
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: memory-seed
    fleettest.kube-agents.io/rung: "400"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 43200
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: memory-seed
        fleettest.kube-agents.io/rung: "400"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260730-200423
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /tmp/work
              tar xzf /corpus-archive/corpus.tar.gz -C /tmp/work
              echo "corpus unpacked: $(ls /tmp/work/corpus | tr '\n' ' ')"
              exec /opt/hermes/.venv/bin/python3 /script/seed_fleet.py \
                --corpus /tmp/work/corpus \
                --rung "${RUNG}" \
                --batch 5 \
                --sleep 2
          env:
            - name: RUNG
              value: "400"
            - name: HINDSIGHT_API_URL
              value: http://hindsight-api.kubeagents-system.svc.cluster.local:8888
            - name: BANK_ID
              value: kube-agents-memory
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: corpus-archive
              mountPath: /corpus-archive
              readOnly: true
            - name: script
              mountPath: /script
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: corpus-archive
          configMap:
            name: kube-agents-fleettest-corpus
        - name: script
          configMap:
            name: kube-agents-fleettest-script
