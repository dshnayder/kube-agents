---
# Remove the doc-shaped corpus caches before the Hindsight re-run (#118).
#
# The PVC survey (rounda2-purge-file-store.yaml) found 72 files carrying corpus
# identifiers. Most of them are NOT touched here, deliberately:
#
#   - /opt/data/profiles/platform/logs/agent.log{,.1}  (294 and 251 ids)
#   - /opt/data/kanban.db                              (119 ids)
#   - /opt/data/profiles/platform/state.db-wal          (78 ids)
#   - /opt/data/plugins/hermes_otel/live.db             (48 ids)
#   - /opt/data/kanban/logs/t_*.log                     (24 files, up to 59 ids)
#
# Those are the run's own audit trail. They are how the five improvisation routes
# were found in the first place, and the findings written into the transcript cite
# them. Deleting evidence to tidy an experiment is the wrong trade.
#
# It is also unnecessary. The Chat Agent — the profile actually under test in a
# non-delegated probe — has no file, terminal or exec tools at all. Its
# `platform_toolsets` is `mcp-router` + `kanban` + the `memory` gate, and
# `agent.disabled_toolsets` is applied last as a denylist over every platform key
# including the real `google_chat` ingress (agents/chat/config.yaml). Nothing on
# this volume is reachable by it. These files only matter if a probe leaks into
# delegation, which the probe prefix suppresses and which is independently
# detectable, because delegation means a kanban task appears.
#
# What IS removed is the subset that reads like documentation rather than like a
# log: standards pages and probe attachments the specialist authored to look
# authoritative. If anything ever does slip, these are what would be found and
# believed. Cheap to remove, nothing depends on them, and their content is already
# quoted in the transcript.
#
# Literal allowlist, no globs — the established rule for this volume. Note
# `t_45ced816` is deliberately absent: it is one of the nine pre-test attachment
# directories that are off-limits for the whole test, and the survey turned it up
# alongside the probe directories.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-rounda2-cleanup-answer-caches
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: rounda2-cleanup
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: rounda2-cleanup
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260730-200423
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import os, shutil

              # The whole directory: the specialist recreates it on every probe,
              # and the user pre-authorised it for the remainder of the test.
              DIRS = [
                  "/opt/data/docs/standards",
                  # Attachment dirs for probes that have been scored. All ten are
                  # now scored. t_45ced816 is NOT here — pre-test, off-limits.
                  "/opt/data/kanban/attachments/t_1b610b3d",
                  "/opt/data/kanban/attachments/t_24669ef6",
                  "/opt/data/kanban/attachments/t_41900a44",
                  "/opt/data/kanban/attachments/t_4b08716e",
                  "/opt/data/kanban/attachments/t_63306f11",
                  "/opt/data/kanban/attachments/t_8b286744",
              ]
              OFF_LIMITS = {
                  "t_0e6886c4", "t_1c43868e", "t_45ced816", "t_4c68b2d0", "t_8eeb19c8",
                  "t_cf413706", "t_d13c5369", "t_da96ce09", "t_eaeda919",
              }

              for d in DIRS:
                  assert os.path.basename(d) not in OFF_LIMITS, f"REFUSING off-limits {d}"

              total_files = total_bytes = 0
              for d in DIRS:
                  if not os.path.isdir(d):
                      print("already gone:", d)
                      continue
                  n = b = 0
                  for root, _, files in os.walk(d):
                      for fn in files:
                          p = os.path.join(root, fn)
                          try:
                              b += os.path.getsize(p)
                              n += 1
                          except OSError:
                              pass
                  shutil.rmtree(d)
                  total_files += n
                  total_bytes += b
                  print(f"removed {d}  ({n} files, {b:,} bytes)")

              print(f"\ntotal: {total_files} files, {total_bytes:,} bytes")

              print("\nverify (all must be True / untouched):")
              print("  standards gone:      ", not os.path.exists("/opt/data/docs/standards"))
              print("  t_45ced816 intact:   ",
                    os.path.isdir("/opt/data/kanban/attachments/t_45ced816"))
              print("  MEMORY.md still gone:",
                    not os.path.exists("/opt/data/memories/MEMORY.md"))
              print("  memories/users intact:",
                    os.path.isdir("/opt/data/memories/users"))
              print("  agent.log intact:    ",
                    os.path.exists("/opt/data/profiles/platform/logs/agent.log"))
              print("  kanban.db intact:    ", os.path.exists("/opt/data/kanban.db"))
              print("  artifacts intact:    ",
                    len(os.listdir("/opt/data/artifacts"))
                    if os.path.isdir("/opt/data/artifacts") else "n/a", "files")
          volumeMounts:
            - name: data
              mountPath: /opt/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
