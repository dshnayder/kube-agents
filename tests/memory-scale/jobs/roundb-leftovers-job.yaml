---
# Enumerate Round A leftovers on the gateway PVC.
#
# Probe 1's specialist verified its answer against
# /opt/data/docs/standards/corpus/all_docs.json — a file Round A left behind,
# not the file-based memory store. Round B therefore did not measure the file
# provider. Before re-running anything I need the exact list of shortcuts that
# exist, by name, so the cleanup can name what it deletes instead of matching a
# heuristic.
#
# Names, sizes and mtimes only — no file contents are printed.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-roundb-leftovers
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: roundb-leftovers
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: roundb-leftovers
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: list
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import datetime, os

              def walk(root, note):
                  print(f"\n===== {root}  ({note}) =====")
                  if not os.path.exists(root):
                      print("  (absent)")
                      return 0
                  total = 0
                  for dp, dn, fn in os.walk(root):
                      dn.sort()
                      for n in sorted(fn):
                          p = os.path.join(dp, n)
                          try:
                              st = os.stat(p)
                          except OSError:
                              continue
                          ts = datetime.datetime.utcfromtimestamp(st.st_mtime).strftime("%m-%d %H:%M")
                          print(f"  {ts}  {st.st_size:>9}  {p}")
                          total += st.st_size
                  print(f"  -- {total} bytes")
                  return total

              walk("/opt/data/docs/standards", "Round A write-ups + the corpus snapshot")
              walk("/opt/data/kanban/attachments", "per-task artefacts")
              walk("/opt/data/memories", "the file-based store Round B is supposed to use")

              print("\n===== other top-level dirs under /opt/data =====")
              for n in sorted(os.listdir("/opt/data")):
                  p = os.path.join("/opt/data", n)
                  kind = "dir " if os.path.isdir(p) else "file"
                  print(f"  {kind}  {n}")
          volumeMounts:
            - name: data
              mountPath: /opt/data
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
            readOnly: true
