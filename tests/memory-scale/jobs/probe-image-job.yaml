---
# Which image still ships `multiuser_memory`?
#
# The tag timestamps look like UTC and the removal commit (9fa85ee) landed at
# 18:45 UTC on 2026-07-29, which would put the boundary between these two tags.
# That is an inference about how the build box names tags, not a fact about the
# images, and #105 depends on getting it right — so ask the images.
#
# Two containers rather than two Jobs: the answer is a comparison, and one pod
# puts both halves in one `kubectl logs` call.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-fleettest-probe-image
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: image-probe
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: image-probe
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: candidate-155133
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "=== dev-20260729-155133 ==="
              echo "-- /opt/hermes/plugins/memory --"
              ls -1 /opt/hermes/plugins/memory/ 2>&1 || echo "(absent)"
              echo "-- multiuser_memory present? --"
              if [ -f /opt/hermes/plugins/memory/multiuser_memory/__init__.py ]; then
                echo "YES  $(wc -l < /opt/hermes/plugins/memory/multiuser_memory/__init__.py) lines"
              else
                echo "NO"
              fi
              echo "-- kube_agents_memory present? --"
              [ -d /opt/hermes/plugins/memory/kube_agents_memory ] && echo YES || echo NO
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
        - name: candidate-201742
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-201742
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "=== dev-20260729-201742 ==="
              echo "-- /opt/hermes/plugins/memory --"
              ls -1 /opt/hermes/plugins/memory/ 2>&1 || echo "(absent)"
              echo "-- multiuser_memory present? --"
              if [ -f /opt/hermes/plugins/memory/multiuser_memory/__init__.py ]; then
                echo "YES  $(wc -l < /opt/hermes/plugins/memory/multiuser_memory/__init__.py) lines"
              else
                echo "NO"
              fi
              echo "-- kube_agents_memory present? --"
              [ -d /opt/hermes/plugins/memory/kube_agents_memory ] && echo YES || echo NO
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
