---
# Measure the corpus-record → Hindsight-document mapping.
#
# Probe 1's specialist derived its citations from
# /opt/data/docs/standards/corpus/all_docs.json — the 335-document export of the
# bank Round A was scored against. Its own assertions say two things that should
# not both be true of a faithful export:
#
#   assert "DEP-003" not in blob          # "DEP-003 absent from corpus"
#   assert "DEP-001" in DEP1_HOST         # yet DEP-003's text is in a doc titled DEP-001
#
# The corpus has 1,664 records and the bank has 335 documents — about 5:1, which
# is exactly seed_fleet.py's `--batch 5`. If Hindsight collapses a multi-item
# retain into one document and keeps one item's context as the title, then four
# of every five records lost their label at seed time and the attribution error
# I attributed to Hindsight in Round A is partly my own harness.
#
# This measures it: per exported document, how many distinct corpus ids appear
# in the body, and whether the title id is one of them. Prints ids and counts
# only — no document text.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-roundb-packing2
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: roundb-packing2
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: roundb-packing2
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeName: gke-kage-management-default-pool-5c8ec3be-nwj9
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: measure
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260729-155133
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import collections, json, re, statistics

              P = "/opt/data/docs/standards/corpus/all_docs.json"
              docs = json.load(open(P))
              print(f"exported documents: {len(docs)}")
              print(f"keys on a document: {sorted(docs[0].keys())}")

              ID = re.compile(r"\b(?:ADR-\d{4}|CAP|CONV|DEP|EXC|GOT|MIG|OWN|PM-\d{4}|RB)-\d{3}\b")

              per_doc, title_in_body, title_is_first, no_title = [], 0, 0, 0
              all_body_ids, all_title_ids = set(), set()

              for d in docs:
                  body = d.get("original_text", "")
                  ctx = d.get("_context", "") or ""
                  ids = list(dict.fromkeys(ID.findall(body)))
                  per_doc.append(len(ids))
                  all_body_ids.update(ids)
                  t = ID.findall(ctx)
                  if not t:
                      no_title += 1
                      continue
                  all_title_ids.add(t[0])
                  if t[0] in ids:
                      title_in_body += 1
                      if ids and t[0] == ids[0]:
                          title_is_first += 1

              print(f"\ndistinct ids in bodies:  {len(all_body_ids)}")
              print(f"distinct ids used as a document title: {len(all_title_ids)}")
              print(f"ids that appear in a body but NEVER title a document: "
                    f"{len(all_body_ids - all_title_ids)}")
              print(f"documents whose title id is absent from their own body: "
                    f"{len(docs) - no_title - title_in_body}")
              print(f"documents with no id in the title: {no_title}")
              print(f"title id is the FIRST id in the body: {title_is_first}")

              print(f"\nids per document: mean {statistics.mean(per_doc):.2f}  "
                    f"median {statistics.median(per_doc)}  "
                    f"min {min(per_doc)}  max {max(per_doc)}")
              print("histogram:", dict(sorted(collections.Counter(per_doc).items())))

              print("\n-- the DEP-003 case, which is what mis-cited probe 1 --")
              for d in docs:
                  if "key-rotation job was decommissioned" in d.get("original_text", ""):
                      ctx = d.get("_context", "")
                      ids = list(dict.fromkeys(ID.findall(d["original_text"])))
                      print(f"  document title : {ctx[:90]}")
                      print(f"  ids in its body: {ids}")
                      print(f"  'DEP-003' literal present in body: {'DEP-003' in d['original_text']}")
                      break

              missing = sorted(x for x in all_body_ids - all_title_ids
                               if x.startswith(("DEP-", "CONV-", "OWN-")))
              print(f"\nDEP/CONV/OWN ids that can never be returned as a document title "
                    f"({len(missing)}): {missing[:40]}")
          volumeMounts:
            - name: data
              mountPath: /opt/data
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: platform-agent-data
            readOnly: true
