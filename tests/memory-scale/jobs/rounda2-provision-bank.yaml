---
# Provision the fresh bank's mission and retain strategies before reseeding.
#
# A Hindsight bank does not exist until something is written to it, and
# `kube_agents_memory._ensure_bank` deliberately does this lazily: the first chat
# session provisions it, so a deleted bank comes back correctly with no manual
# operator step. That is the right design and it is why deleting the Postgres PVC
# is a safe reset — but it means that between the PVC delete and the first DM the
# bank is bare, and `seed_fleet.py` refuses to run against a bare bank:
#
#   bank 'kube-agents-memory' has no ['personal', 'shared'] retain strategy
#
# That refusal is a feature (the seeder exists to write what the *production
# provider* would write, so it will not invent strategy names), but it puts the
# reseed behind a chat round-trip. This job removes that ordering constraint by
# doing exactly what `_ensure_bank` does, with exactly the provider's own values.
#
# The values are not retyped here — retyping them is the whole risk, since a
# reseed under a subtly different retain_mission would be measuring a different
# extractor. Instead the job parses the constants straight out of the installed
# plugin source with `ast`, evaluating only literal assignments in a namespace
# with no builtins. If the plugin cannot be found, or the constants cannot be
# recovered, it fails rather than falling back to a guess.
#
# Idempotent: it makes the same "already correct?" comparison `_ensure_bank`
# makes, and exits without writing if the bank is already provisioned.
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-agents-rounda2-provision-bank
  namespace: kubeagents-system
  labels:
    app.kubernetes.io/name: kube-agents-fleettest
    app.kubernetes.io/component: rounda2-provision
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-agents-fleettest
        app.kubernetes.io/component: rounda2-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        fsGroup: 10000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision
          image: us-central1-docker.pkg.dev/agentic-harness-demo/demo/platform-agent:dev-20260730-200423
          command: ["/opt/hermes/.venv/bin/python3", "-c"]
          args:
            - |
              import ast, json, os, sys, urllib.request, urllib.error

              API = os.environ["HINDSIGHT_API_URL"].rstrip("/") + "/v1/default"
              BANK = os.environ["BANK_ID"]

              # --- locate the installed provider ------------------------------
              cands = []
              for root in ("/opt/defaults", "/opt/data", "/opt/hermes"):
                  for dirpath, dirnames, filenames in os.walk(root):
                      dirnames[:] = [d for d in dirnames if d != "__pycache__"]
                      if os.path.basename(dirpath) == "kube_agents_memory" and "__init__.py" in filenames:
                          cands.append(os.path.join(dirpath, "__init__.py"))
              if not cands:
                  sys.exit("FATAL: kube_agents_memory not found in the image")
              src_path = sorted(cands)[0]
              print("provider source:", src_path)
              for extra in sorted(cands)[1:]:
                  print("  (also present:", extra, ")")

              # --- recover its constants without importing hermes -------------
              ns = {}
              tree = ast.parse(open(src_path, encoding="utf-8").read())
              for node in tree.body:
                  if not isinstance(node, ast.Assign):
                      continue
                  for tgt in node.targets:
                      if not isinstance(tgt, ast.Name):
                          continue
                      try:
                          ns[tgt.id] = eval(  # noqa: S307 - literals only, no builtins
                              compile(ast.Expression(node.value), "<const>", "eval"),
                              {"__builtins__": {}}, ns)
                      except Exception:
                          pass

              need = ["DEFAULT_BANK_ID", "BANK_MISSION", "RETAIN_STRATEGIES", "PERSONAL_STRATEGY"]
              missing = [k for k in need if k not in ns]
              if missing:
                  sys.exit(f"FATAL: could not recover {missing} from {src_path}")

              if ns["DEFAULT_BANK_ID"] != BANK:
                  sys.exit(f"FATAL: provider pins bank {ns['DEFAULT_BANK_ID']!r}, job targets {BANK!r}")

              print("recovered constants:")
              print("  DEFAULT_BANK_ID   =", ns["DEFAULT_BANK_ID"])
              print("  PERSONAL_STRATEGY =", ns["PERSONAL_STRATEGY"])
              print("  RETAIN_STRATEGIES =", sorted(ns["RETAIN_STRATEGIES"]))
              print("  BANK_MISSION      =", len(ns["BANK_MISSION"]), "chars")

              def call(method, path, body=None, timeout=120):
                  data = json.dumps(body).encode() if body is not None else None
                  req = urllib.request.Request(
                      API + path, data=data, method=method,
                      headers={"Content-Type": "application/json"})
                  try:
                      return json.loads(urllib.request.urlopen(req, timeout=timeout).read() or "{}")
                  except urllib.error.HTTPError as e:
                      raise RuntimeError(f"HTTP {e.code} on {method} {path}: {e.read()[:400]!r}") from e

              cfg = (call("GET", f"/banks/{BANK}/config") or {}).get("config") or {}
              if (cfg.get("retain_strategies") == ns["RETAIN_STRATEGIES"]
                      and cfg.get("retain_default_strategy") == ns["PERSONAL_STRATEGY"]):
                  print("\nalready provisioned — nothing to do")
                  raise SystemExit(0)

              # PUT is both create and update here (`POST /banks` is 405) — the
              # same double duty the provider's create_bank() relies on, so an
              # existing bank keeps its facts.
              print("\nprovisioning...")
              call("PUT", f"/banks/{BANK}", {"mission": ns["BANK_MISSION"]})
              # The config PATCH wraps its payload in `updates`.
              call("PATCH", f"/banks/{BANK}/config", {"updates": {
                  "retain_strategies": ns["RETAIN_STRATEGIES"],
                  "retain_default_strategy": ns["PERSONAL_STRATEGY"],
              }})

              cfg = (call("GET", f"/banks/{BANK}/config") or {}).get("config") or {}
              ok = (cfg.get("retain_strategies") == ns["RETAIN_STRATEGIES"]
                    and cfg.get("retain_default_strategy") == ns["PERSONAL_STRATEGY"])
              print("verify:")
              print("  strategies:", sorted(cfg.get("retain_strategies") or {}))
              print("  default:   ", cfg.get("retain_default_strategy"))
              print("  matches provider:", ok)
              if not ok:
                  sys.exit("FATAL: provisioning did not take")
          env:
            - name: HINDSIGHT_API_URL
              value: http://hindsight-api.kubeagents-system.svc.cluster.local:8888
            - name: BANK_ID
              value: kube-agents-memory
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
